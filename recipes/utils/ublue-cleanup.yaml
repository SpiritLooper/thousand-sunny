# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    remove:
      auto-remove: true
      packages:
        # Ublue main base default
        - avahi
        - gamemode
        - game-music-emu
        - ublue-os-just
        - ublue-os-update-services
        # VM guest additions stuff
        - open-vm-tools
        - virtualbox-guest-additions
        - hyperv-daemons
        - hypervfcopyd
        - hypervkvpd
        - hypervvssd
        - nvidia-gpu-firmware
        # Firefox stuff
        - firefox
        - firefox-langpacks
        # Disk stuff
        - mdadm
  - type: systemd
    system:
      disabled:
        - sshd.service
        - rpm-ostree-countme.service
        - rpm-ostree-countme.timer
        - rpm-ostreed-automatic.service
        - rpm-ostreed-automatic.timer