# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: files
    files:
      - source: system
        destination: /
  - type: files
    files:
      - source: logo/thousand-sunny-small.png
        destination: /usr/share/pixmaps
  - type: os-release
    properties:
      ID: fedora
      NAME: Thousand Sunny
      PRETTY_NAME: Thousand Sunny
  - type: initramfs
